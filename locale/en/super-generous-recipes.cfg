[mod-setting-description]
sgr-global=Does not do anything. Only here to separate each of the categories.
sgr-global-multiplier=Multiplies the below recipe properties by the given value.\nRange: 0.00001 - 65535. 1 = unchanged.\n-Recipe Requirements (Requires: 'Allow Requirement Amount Editing')\n-Recipe Item Output (Requires: 'Allow Recipe Output Editing of Items')\n-Recipe Fluid Output (Requires: 'Allow Recipe Output Editing of Fluid')\n-Recipe Crafting Time (Requires: 'Allow Crafting Time Editing')
sgr-global-time-multiplier=Scales how long crafting and researching takes. Lower values are faster. eg: 0.5 will make everything take half as long.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nCrafting time is scaled even when 'Allow Crafting Time Editing' is turned off.\nResearch time requires 'Allow Research Editing'.
sgr-global-cost-multiplier=Scales how much everything costs to make and to run.\n-How many ingredients each recipe needs (Requires: 'Allow Requirement Amount Editing')\n-How many science packs each research costs (Requires: 'Allow Research Editing')\n-How much power buildings draw and how much fuel they burn (Requires: 'Allow Power Editing')\n\nRange: 0.00001 - 65535. 1 = unchanged.
sgr-global-output-multiplier=Scales how much you get out of everything.\n-Items produced by recipes (Requires: 'Allow Recipe Output Editing of Items')\n-Fluid produced by recipes (Requires: 'Allow Recipe Output Editing of Fluid')\n-Power generated by buildings and Roboport recharging (Requires: 'Allow Power Editing')\n\nRange: 0.00001 - 65535. 1 = unchanged.
sgr-global-output-prioritize-max=Always give the maximum amount of output when calculating how much each recipe gives, so a recipe never produces less than it does in Vanilla.\nFixes mods that require large amounts of output to work.\n\nEnabled by default.\n\nRequires: 'Allow Recipe Output Editing of Items' or 'Allow Recipe Output Editing of Fluid'
sgr-global-output-exceeds-requirements=Some recipes require the same item that it outputs. This makes sure the recipe always gives 1 more than is required.\n\nExample: Fixes 'Kovarex enrichment process' giving less Uranium 235 and 238 than it required to be used.\n\nEnabled by default.\n\nRequires: 'Allow Recipe Output Editing of Items' or 'Allow Recipe Output Editing of Fluid'

sgr-stacksize-item-edit=Allows Super Generous Recipes to edit the Stack Size of items.
sgr-stacksize-item=Maximum Items that will fit in 1 inventory slot.\nEvery craftable item is set to this exact value. Vanilla and mod stack sizes are discarded.\nRange: 1 - 65535.\n\nOnly items produced by a recipe are changed, so mined resources such as Iron Ore, Coal and Stone keep their original Stack Size.\nItems that can never stack (Armor, anything with an equipment grid, items flagged not-stackable) are always skipped.\n\nRequires: 'Allow Item Stack Size Editing'
sgr-should-multiply-stacksize=Multiplies the 'Item Stack Size' value above by the total number of ingredients needed to craft the item throughout its entire crafting tree.\nCheap early game items get small stacks and expensive late game items get very large ones.\n\nRequires: 'Allow Item Stack Size Editing'

sgr-stacksize-inserter-stacksize-research-edit=Allows Super Generous Recipes to modify how much Stack Size and capacity is granted by Inserter and Bulk Inserter research.
sgr-stacksize-inserter=Multiplies the Stack Size bonus granted by each Inserter capacity research.\nThis is a multiplier, not a flat amount. eg: 20 turns a Vanilla bonus of +1 into +20.\nRange: 1 - 65535. 1 = unchanged.\n\nRequires: 'Allow Inserter Stack Size Research Editing'
sgr-stacksize-stack-inserter=Multiplies the capacity bonus granted by each Bulk Inserter capacity research. Bulk Inserters were called Stack Inserters before Factorio 2.0.\nThis is a multiplier, not a flat amount. eg: 50 turns a Vanilla bonus of +1 into +50.\nRange: 1 - 65535. 1 = unchanged.\n\nRequires: 'Allow Inserter Stack Size Research Editing'

sgr-stacksize-robot-stacksize-research-edit=Allows Super Generous Recipes to modify how much cargo size is granted by Robot research.
sgr-stacksize-robot=Multiplies the cargo size bonus granted by each Worker Robot Cargo Size research.\nThis is a multiplier, not a flat amount. eg: 5 turns a Vanilla bonus of +1 into +5.\nRange: 1 - 65535. 1 = unchanged.\n\nRequires: 'Allow Robot Stack Size Research Editing'

sgr-output-item-edit=Allows Super Generous Recipes to edit the amount of items provided when making a recipe.
sgr-output-item-multiplier=Multiplies the total amount of items outputted by recipes.\nStacks with 'Global Recipe Multiplier' and 'Global Output Multiplier'.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Recipe Output Editing of Items'
sgr-output-item-type=Set the type of calculation done to determine how many items are given from recipes.\n\n--Default--\nUses default values from Vanilla or Mods.\n\n--Custom--\nSpecify how many items are given for all recipes in the 'Recipe Output Item Custom Amount' option.\n\n--Total Required Recipes--\nRecipes create as many items as the total number of ingredients needed to make it throughout the entire crafting tree.\nGood to get small amount of items at the start of the game and lots near the end.\n\n--Stack Size--\nEach recipe creates as many items as the output item's maximum stack size.\n\n--Max Recipe Uses--\nRecipes output as many items as the output item is needed for other recipes.\nGood to get lots of items at the start of a game but less at late game.\n\nWhatever is calculated is still scaled by the multiplier settings, and may be raised by 'Output Always Give Maximum' and 'Output Always Exceeds Requirements'. The final amount is clamped to 1 - 65535.\n\nRequires: 'Allow Recipe Output Editing of Items'
sgr-output-item-custom-amount=How many items each recipe gives when crafted.\nRange: 1 - 65535.\n\nThis is not an exact amount. It is still multiplied by 'Recipe Output Item Multiplier', 'Global Recipe Multiplier' and 'Global Output Multiplier', and may be raised further by 'Output Always Give Maximum' and 'Output Always Exceeds Requirements'.\n\nRequires: 'Recipe Output Item Calculation Type' set to 'Custom'

sgr-output-fluid-edit=Allows Super Generous Recipes to edit the amount of fluid provided when making a recipe.
sgr-output-fluid-multiplier=Multiplies the total amount of fluid output by recipes.\nStacks with 'Global Recipe Multiplier' and 'Global Output Multiplier'.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Recipe Output Editing of Fluid'
sgr-output-fluid-type=Set the type of calculation done to determine how much fluid is given from recipes.\n\n--Default--\nUses default values from Vanilla or Mods.\n\n--Custom--\nSpecify how much fluid is given for all recipes in the 'Recipe Output Fluid Custom Amount' option.\n\n--Total Required Recipes--\nRecipes create as much fluid as the total number of ingredients needed to make it throughout the entire crafting tree.\nGood to get small amount of fluid at the start of the game and lots near the end.\n\n--Stack Size--\nHas no effect. Fluids do not have a stack size, so fluid output is left unchanged.\n\n--Max Recipe Uses--\nRecipes output as much fluid as the output fluid is needed for other recipes.\nGood to get lots of fluid at the start of a game but less at late game.\n\nWhatever is calculated is still scaled by the multiplier settings, and may be raised by 'Output Always Give Maximum' and 'Output Always Exceeds Requirements'. The final amount is clamped to 1 - 65535.\n\nRequires: 'Allow Recipe Output Editing of Fluid'
sgr-output-fluid-custom-amount=How much fluid each recipe gives when crafted.\nRange: 1 - 65535.\n\nThis is not an exact amount. It is still multiplied by 'Recipe Output Fluid Multiplier', 'Global Recipe Multiplier' and 'Global Output Multiplier', and may be raised further by 'Output Always Give Maximum' and 'Output Always Exceeds Requirements'.\n\nRequires: 'Recipe Output Fluid Calculation Type' set to 'Custom'

sgr-requirements-edit=Allows Super Generous Recipes to edit the amount of ingredients required to make a recipe.
sgr-requirements-multiplier=Multiplies the amount of items and fluid required for each recipe.\nStacks with 'Global Recipe Multiplier' and 'Global Cost Multiplier'.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Requirement Amount Editing'
sgr-requirement-item-type=Set the type of calculation done to determine how many items and how much fluid each recipe requires.\n\n--Default--\nUses default values from Vanilla or Mods.\n\n--Custom--\nSpecify the amount required for all recipes in the 'Recipe Requirement Custom Item Amount' and 'Recipe Requirement Custom Fluid Amount' options.\n\n--Total Required Recipes--\nRecipes require as much of every ingredient as the total number of ingredients needed to make it throughout the entire crafting tree.\nEarly game recipes require small amounts where late game recipes require larger amounts.\n\nWhatever is calculated is still scaled by the multiplier settings, and the final amount is clamped to 1 - 65535.\n\nRequires: 'Allow Requirement Amount Editing'
sgr-requirement-item-amount=Sets how much of each item is required for every recipe.\nRange: 1 - 65535.\n\nThis is not an exact amount. It is still multiplied by 'Recipe Requirement Multiplier', 'Global Recipe Multiplier' and 'Global Cost Multiplier'.\n\nRequires: 'Recipe Requirement Item Calculation Type' set to 'Custom'
sgr-requirement-fluid-amount=Sets how much of each fluid is required for every recipe.\nRange: 1 - 65535.\n\nThis is not an exact amount. It is still multiplied by 'Recipe Requirement Multiplier', 'Global Recipe Multiplier' and 'Global Cost Multiplier'.\n\nRequires: 'Recipe Requirement Item Calculation Type' set to 'Custom'

sgr-time-edit=Allows Super Generous Recipes to edit the Crafting time to create recipes.
sgr-time-multiplier=Multiplies the time taken to craft a recipe.\nStacks with 'Global Recipe Multiplier' and 'Global Time Multiplier'.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Crafting Time Editing'
sgr-time-custom-amount=How long in seconds every recipe takes to craft.\nRange: 0.1 - 65535 seconds.\n\nThis is not an exact time. It is still multiplied by 'Recipe Crafting Time Multiplier', 'Global Recipe Multiplier' and 'Global Time Multiplier'.\n\nRequires: 'Recipe Crafting Time Calculation Type' set to 'Custom'
sgr-time-type=Set the type of calculation done to determine how long each recipe will take to craft.\n\n--Default--\nUses default values from Vanilla or Mods.\n\n--Custom--\nSpecify how long each recipe will take to craft in the 'Recipe Crafting Time Custom Amount' option.\n\n--Total Required Recipes--\nRecipes that require more items to craft will take longer to craft than those with few.\nGood to speed up early game and lengthen late game.\n\n--Max ingredient depth--\nRecipes take 1 second for every step in their crafting tree, so basic items are quick and deeply nested items are slow.\n\n--Max Recipe Uses--\nRecipes that are used by many other recipes take longer to craft than those used by few.\nGood to lengthen early game and shorten late game.\n\nWhatever is calculated is still scaled by the multiplier settings, and the final time is clamped to 0.1 - 65535 seconds.\n\nRequires: 'Allow Crafting Time Editing'

sgr-item-rocket-weight-edit=Allows Super Generous Recipes to edit the rocket weight of Items.
sgr-item-rocket-weight-multiplier=Multiplies the rocket weight of each item.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nWeights are capped at the rocket lift limit (1 tonne) so items always remain launchable, and are never reduced below 1 gram.\n\nOnly items that declare a weight of their own are changed, which is around 150 items. Every other item has its weight worked out from its recipe after all mods have loaded, so those are reshaped by the ingredient, output and stack size settings instead. Turn on 'Weigh Items Without A Weight' to bring them under this multiplier too.\n\nRequires: 'Allow Item Rocket Weight Editing'
sgr-item-rocket-weight-type=Set the type of calculation done to determine how to modify the rocket weight of items.\n\n--Default--\nUses default values from Vanilla or Mods.\n\n--Custom--\nSpecify the rocket weight of all items in the 'Item Rocket Weight Custom Amount' option.\n\nRequires: 'Allow Item Rocket Weight Editing'
sgr-item-rocket-weight-custom-amount=The rocket weight of every item, in grams. 1000 grams = 1kg, 1000000 grams = 1 tonne.\nRange: 0.01 - 65535 grams.\n\nThis is not an exact weight. It is still multiplied by 'Item Rocket Weight Multiplier' and capped at the rocket lift limit.\n\nRequires: 'Item Rocket Weight Calculation Type' set to 'Custom'
sgr-item-rocket-weight-preserve-heavy=In Vanilla some items are heavier than a rocket can lift (1 tonne) so they can never be launched, such as the Rocket Silo at 10 tonnes and the Atomic Bomb at 1.5 tonnes.\n\nWhen enabled these items keep their original weight.\nWhen disabled they are reduced to the rocket lift limit, making them launchable.\n\nRequires: 'Allow Item Rocket Weight Editing'
sgr-item-rocket-weight-derive-missing=Most items, such as the Wooden Chest, do not carry a weight of their own but can hold a maximum of their stack-size. \n\nWhen enabled these items are will be given a weight equal to their stack-size to then be affected by the multiplier.\n\nHas no effect while 'Item Rocket Weight Multiplier' is 1 and the calculation type is 'Default'.\n\nRequires: 'Allow Item Rocket Weight Editing'

sgr-spoilage-edit=Allows Super Generous Recipes to edit the time that Items take to spoil.
sgr-spoilage-time-multiplier=Multiplies the time for an item to spoil. Higher values make food and other perishables last longer.\nRange: 0 - 65535. 1 = unchanged.\n\nSet to 0 to remove spoiling completely. Items will never spoil and never turn into anything else.\n\nRequires: 'Allow Item Spoilage Time Editing'
sgr-spoilage-time-type=Set the type of calculation done to determine how long each item will take to spoil.\n\n--Default--\nUses default values from Vanilla or Mods.\n\n--Custom--\nSpecify exactly how long each item takes to spoil in the 'Spoilage Time Custom Amount' option.\n\nRequires: 'Allow Item Spoilage Time Editing'
sgr-spoilage-time-custom-amount=How long every item takes to spoil, in ticks.\n60 ticks = 1 second, 3600 = 1 minute, 216000 = 1 hour.\n\nSet to 0 to remove spoiling completely.\n\nThis is not an exact time. It is still multiplied by 'Spoilage Time Multiplier'.\n\nRequires: 'Spoilage Time Calculation Type' set to 'Custom'

sgr-power-edit=Allows Super Generous Recipes to edit properties related to Power/Energy.
sgr-power-multiplier=Multiplies all Power related properties. This stacks on top of every other Power setting below.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Power Editing'
sgr-power-output-multiplier=Multiplies how much power is provided by Steam Engines, Steam Turbines, Solar Panels, generator equipment... etc.\nAlso scales building effectivity, which is how much power is produced from the same steam or fuel.\nStacks with 'Global Output Multiplier'.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Power Editing'
sgr-power-requirement-multiplier=Multiplies how much power is required to power things. Covers building power usage, idle drain, the energy Inserters spend moving and rotating, and the energy a Laser Turret spends per shot.\nStacks with 'Global Cost Multiplier'.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Power Editing'
sgr-power-storage-multiplier=Multiplies how much power can be stored in anything that requires power or stores it for later use, such as Accumulators, Roboports and personal equipment.\nAlso scales how quickly Accumulators can be charged and discharged.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Power Editing'
sgr-power-fuel-consumption-multiplier=Multiplies how much fuel is consumed by Steam Engines, Boilers, Burner Drills, Locomotives... etc. Lower values make a piece of fuel last longer.\nStacks with 'Global Cost Multiplier'.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Power Editing'
sgr-power-recharge-multiplier=Multiplies how quickly Roboports charge Robots, and the minimum amount of energy a Roboport must hold before it will charge them.\nStacks with 'Global Output Multiplier'.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Power Editing'

sgr-mining-drill-edit=Allows Super Generous Recipes to edit properties related to Mining Drills.
sgr-mining-drill-speed-multiplier=Multiplies how fast mining drills work. Higher number means more resources per second.\nRange: 0.00001 - 6553. 1 = unchanged.\n\nRequires: 'Allow Mining Drill Editing'
sgr-mining-drill-area-multiplier=Multiplies the distance at which mining drills can find nearby resources.\nThe drill keeps its normal size and highlighted area, it just reaches further than it looks like it does.\nRange: 0.00001 - 6553. 1 = unchanged. The reach never drops below 0.1 tiles.\n\nRequires: 'Allow Mining Drill Editing'

sgr-research-edit=Allows Super Generous Recipes to edit research cost and time.
sgr-research-multiplier=Multiplies all research properties. This stacks on top of every other Research setting below.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Research Editing'
sgr-research-cost-multiplier=Multiplies how many of each science pack a research costs.\nStacks with 'Research Multiplier' and 'Global Cost Multiplier'.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Research Editing'
sgr-research-cost-type=Set the type of calculation done to determine how many of each science pack a research costs.\n\n--Default--\nUses default values from Vanilla or Mods.\n\n--Custom--\nSpecify how many of each science pack every research costs in the 'Research Cost Custom Amount' option.\n\nRequires: 'Allow Research Editing'
sgr-research-cost-custom-amount=How many of each science pack every research costs.\nRange: 1 - 65535.\n\nThis is not an exact amount. It is still multiplied by 'Research Cost Multiplier', 'Research Multiplier' and 'Global Cost Multiplier'.\n\nRequires: 'Research Cost Calculation Type' set to 'Custom'
sgr-research-count-multiplier=Multiplies how many times you need to complete each science pack, and how many items you need to craft for researches that are unlocked by crafting.\nStacks with 'Research Multiplier'.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Research Editing'
sgr-research-count-type=Set the type of calculation done to determine how many times you need to complete each science pack.\n\n--Default--\nUses default values from Vanilla or Mods.\n\n--Custom--\nSpecify how many of all science packs are needed in the 'Research Count Custom Amount' option.\n\nRequires: 'Allow Research Editing'
sgr-research-count-custom-amount=How many of all science packs you need to complete a research.\nRange: 1 - 65535.\n\nThis is not an exact amount. It is still multiplied by 'Research Count Multiplier' and 'Research Multiplier'.\n\nRequires: 'Research Count Calculation Type' set to 'Custom'
sgr-research-time-multiplier=Multiplies how long each research takes to finish.\nStacks with 'Research Multiplier' and 'Global Time Multiplier'.\nRange: 0.00001 - 65535. 1 = unchanged.\n\nRequires: 'Allow Research Editing'
sgr-research-time-type=Set the type of calculation done to determine how long each research takes to finish.\n\n--Default--\nUses default values from Vanilla or Mods.\n\n--Custom--\nSpecify in seconds how long all research takes to finish in the 'Research Time Custom Seconds' option. This also replaces the science pack formula used by infinite research with the 'Infinite Research Count Formula' option.\n\nRequires: 'Allow Research Editing'
sgr-research-time-custom-amount=How long in seconds every research takes to finish.\nRange: 0.01 - 65535 seconds.\n\nThis is not an exact time. It is still multiplied by 'Research Time Multiplier', 'Research Multiplier' and 'Global Time Multiplier'.\n\nRequires: 'Research Time Calculation Type' set to 'Custom'
sgr-research-time-infinite-custom-amount=Replaces the formula that decides how many science packs each level of an infinite research costs. Use basic math to make your formula where `L` is the current level of the research.\neg: 2^(L-7)*1000\n\nThe default value of `L` is far cheaper than Vanilla, so turning Custom on without changing this will make infinite research almost free.\n\nThe formula is still multiplied by 'Research Count Multiplier' and 'Research Multiplier'.\n\nRequires: 'Research Time Calculation Type' set to 'Custom'

